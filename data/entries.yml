- id: docs-ttsr
  name: omp 文档：TTSR 注入生命周期
  url: https://github.com/can1357/oh-my-pi/blob/main/docs/ttsr-injection-lifecycle.md
  category: doc
  kind: doc
  omp_support: native
  evidence_type: verified
  evidence: 官方文档，列出 ttsr-coordinator.ts 等实现文件
  sources:
  - url: https://github.com/can1357/oh-my-pi/blob/main/docs/ttsr-injection-lifecycle.md
    label: null
  verified_at: '2026-10-21'
  featured: true
  rank: 7
  task: understand
  why: omp 最独特的机制：规则平时不占上下文，模型输出命中正则才中断流、注入规则并重试。这篇把发现、中断、重试、会话状态一路讲到源码。
  why_en: 'omp''s most distinctive mechanism: rules cost no context until the output matches a regex, then the stream is aborted, the rule injected and the turn retried. Traced to source.'
