# Weekly link check. Never fails the run; opens an issue labelled "links" instead.
name: Link check
on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 01:00 UTC = 09:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress '**/*.md' 'data/*.yml'
          fail: false
          output: lychee/out.md
      - if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links detected
          content-filepath: lychee/out.md
          labels: links
